name: Build ControlWard macOS App

on:
  push:
    branches: [main]
    paths: ['native-crm/**', 'bin/**', '.github/workflows/build-macos-app.yml']
  pull_request:
    branches: [main]
    paths: ['native-crm/**', 'bin/**', '.github/workflows/build-macos-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record Swift toolchain
        run: swift --version
      - name: Test, package and verify ControlWard
        env:
          CONTEXTWARD_SIGN_IDENTITY: '-'
        run: ./bin/package-native-app
      - name: Upload local-signature build
        uses: actions/upload-artifact@v4
        with:
          name: ControlWard-macOS
          path: |
            native-crm/release/ControlWard-*.zip
            native-crm/release/ControlWard-*.sha256
          if-no-files-found: error
          retention-days: 30
