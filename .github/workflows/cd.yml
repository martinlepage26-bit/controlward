name: Deploy Contextward API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contextward-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Test Worker
        run: yarn test:worker
      - name: Validate Worker bundle
        run: yarn check:worker
      - name: Apply D1 migrations
        run: yarn wrangler d1 migrations apply pharos-contextward --remote --config pharos-api/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c384d639b3515a824b1c245d79245e76
      - name: Deploy Worker
        run: yarn wrangler deploy --config pharos-api/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c384d639b3515a824b1c245d79245e76
      - name: Verify production health
        run: |
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors https://pharos-contextward-api.ml-c38.workers.dev/v1/health)"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.ok!==true||body.service!=="pharos-contextward-api"||body.environment!=="production"||body.storage!=="d1") process.exit(1)' "$response"
