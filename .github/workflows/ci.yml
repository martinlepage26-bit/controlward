name: CI

# CI runner: the extension-and-worker job and the secrets guard run on
# Martin's self-hosted runner on CT920 (labels self-hosted, ct920) to save
# GitHub-hosted minutes. twenty-integration (spawns a Twenty instance with
# Docker) and native-macos stay on GitHub-hosted runners; cd.yml and
# publish.yml are unchanged. No self-hosted job may use secrets other than
# GITHUB_TOKEN (scripts/check-self-hosted-secrets.py enforces it). To revert,
# change `runs-on: [self-hosted, ct920]` back to `runs-on: ubuntu-latest`.

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-secrets-guard:
    name: Self-hosted runner secrets guard
    runs-on: [self-hosted, ct920]
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m venv /tmp/guard && /tmp/guard/bin/pip install pyyaml==6.0.2
      - run: /tmp/guard/bin/python scripts/check-self-hosted-secrets.py --self-test
      - run: /tmp/guard/bin/python scripts/check-self-hosted-secrets.py .github/workflows

  extension-and-worker:
    needs: runner-secrets-guard
    runs-on: [self-hosted, ct920]
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:unit
      - run: yarn test:worker
      - run: yarn check:worker

  twenty-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spawn Twenty test instance
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@main
        with:
          twenty-version: latest
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Run Twenty integration tests
        run: yarn test
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}

  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Record Swift toolchain
        run: |
          swift --version
          actual_major="$(swift --version | sed -nE 's/.*Swift version ([0-9]+).*/\1/p' | head -1)"
          test "${actual_major:-0}" -ge 6
      - name: Native test suite
        run: ./bin/test-native-app
      - name: Native release build
        run: swift build -c release --package-path native-crm
