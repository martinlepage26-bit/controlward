name: Build ContextWard macOS App

on:
  push:
    branches: [ main, feat/product-promises-20261014 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

    - name: Verify Xcode
      run: xcodebuild -version

    - name: Build FollowUpOSNative
      run: |
        cd native-crm
        xcodebuild -scheme FollowUpOSNative \
          -workspace FollowUpOSNative.xcworkspace \
          -configuration Release \
          -derivedDataPath build

    - name: Locate built app
      run: |
        find native-crm/build -name "FollowUpOSNative.app" -type d

    - name: Create artifact directory
      run: mkdir -p artifacts

    - name: Copy app to artifacts
      run: |
        APP_PATH=$(find native-crm/build -name "FollowUpOSNative.app" -type d | head -1)
        if [ -n "$APP_PATH" ]; then
          cp -r "$APP_PATH" artifacts/
          echo "App copied to artifacts/"
        else
          echo "ERROR: Could not find built app"
          exit 1
        fi

    - name: Create DMG for distribution
      run: |
        hdiutil create -volname "ContextWard" \
          -srcfolder artifacts \
          -ov -format UDZO \
          artifacts/ContextWard.dmg

    - name: Upload app artifact
      uses: actions/upload-artifact@v4
      with:
        name: FollowUpOSNative-app
        path: artifacts/FollowUpOSNative.app
        retention-days: 30

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: ContextWard-dmg
        path: artifacts/ContextWard.dmg
        retention-days: 30

    - name: Build summary
      if: success()
      run: |
        echo "Build completed successfully!"
        echo "Artifacts available for download:"
        echo "  - FollowUpOSNative.app (raw app bundle)"
        echo "  - ContextWard.dmg (distributable disk image)"
